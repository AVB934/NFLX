<!-- templates base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Netflix Stock Price Prediction - AI-powered stock price predictor using machine learning">
    <meta name="author" content="NFLX Predictor Team">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <title>{% block title %}NFLX Stock Closing Price Predictor{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'nflx:home' %}" class="logo">📊 NFLX Predictor</a></h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="{% url 'nflx:home' %}">🏠 Home</a></li>
            <li><a href="{% url 'nflx:predict' %}">🔮 Predict</a></li>
        </ul>
    </nav>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 NFLX Stock Closing Price Predictor. All rights reserved. | Built with Django & PyTorch</p>
        </div>
    </footer>
</body>
</html>
